name: "Go Lint"
description: "Run golangci-lint on a Go project"

inputs:
  version:
    description: "golangci-lint version to install"
    required: false
    default: "v1.62.2"
  working-directory:
    description: "Directory containing the Go project"
    required: false
    default: "."
  args:
    description: "Additional arguments to pass to golangci-lint run"
    required: false
    default: ""
  go-version:
    description: "Go version to use (passed to actions/setup-go)"
    required: false
    default: "stable"
  config:
    description: "Path to golangci-lint config file"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ inputs.go-version }}

    - name: Install golangci-lint
      shell: bash
      run: |
        set -euo pipefail
        version="${{ inputs.version }}"
        curl --fail-with-body --silent --show-error --retry 3 \
          "https://raw.githubusercontent.com/golangci/golangci-lint/${version}/install.sh" \
          | sh -s -- -b "$(go env GOPATH)/bin" "$version"

    - name: Run golangci-lint
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        LINT_CONFIG: ${{ inputs.config }}
        LINT_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        args=(run)
        [[ -n "$LINT_CONFIG" ]] && args+=(--config "$LINT_CONFIG")
        # args remains intentionally shell-like for backwards compatibility.
        read -r -a extra_args <<< "$LINT_ARGS"
        args+=("${extra_args[@]}")
        "$(go env GOPATH)/bin/golangci-lint" "${args[@]}"
