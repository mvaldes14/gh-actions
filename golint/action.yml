name: "Go Lint"
description: "Run golangci-lint on a Go project"

inputs:
  version:
    description: "golangci-lint version to install"
    required: false
    default: "v1.62.2"
  working-directory:
    description: "Directory containing the Go project"
    required: false
    default: "."
  args:
    description: "Additional arguments to pass to golangci-lint run"
    required: false
    default: ""
  go-version:
    description: "Go version to use (passed to actions/setup-go)"
    required: false
    default: "stable"
  config:
    description: "Path to golangci-lint config file"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}

    - name: Install golangci-lint
      shell: bash
      run: |
        curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
          | sh -s -- -b "$(go env GOPATH)/bin" ${{ inputs.version }}

    - name: Run golangci-lint
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        CONFIG_FLAG=""
        if [ -n "${{ inputs.config }}" ]; then
          CONFIG_FLAG="--config ${{ inputs.config }}"
        fi

        "$(go env GOPATH)/bin/golangci-lint" run $CONFIG_FLAG ${{ inputs.args }}
