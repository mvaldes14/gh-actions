name: Validate

on:
  push:
  pull_request:

permissions: {}

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Validate workflows
        run: |
          actionlint_bin="$(go env GOPATH)/bin/actionlint"
          "$actionlint_bin"
      - name: Check diff and README links
        run: |
          git diff --check
          test -d examples
          for link in examples/monorepo-images.yml examples/lua-repo.yml examples/pr-agent.yml; do
            test -f "$link"
          done

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck
          find . -type f -name '*.sh' -print0 |
            xargs -0 -r shellcheck --shell=bash --format=gcc
