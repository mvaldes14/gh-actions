# Reusable PR-Agent workflow.
# The caller must trigger this workflow on pull_request_target and issue_comment.
name: PR Agent

permissions: {}

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    secrets:
      BEDROCK_API_KEY:
        description: "Amazon Bedrock API key used by PR-Agent"
        required: true

jobs:
  pr-agent:
    name: Review pull requests with PR-Agent
    # Ignore bot-triggered events, non-PR comments, and Renovate-authored PRs.
    if: >-
      github.event.sender.type != 'Bot' &&
      (
        (
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.user.login != 'renovate[bot]' &&
          !startsWith(github.event.pull_request.head.ref, 'renovate/')
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          github.event.issue.user.login != 'renovate[bot]'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check commented PR branch
        if: github.event_name == 'issue_comment'
        id: commented-pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          head_ref=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.ref')
          if [[ "$head_ref" == renovate/* ]]; then
            echo "is-renovate=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-renovate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run PR-Agent
        if: github.event_name != 'issue_comment' || steps.commented-pr.outputs.is-renovate != 'true'
        uses: the-pr-agent/pr-agent@68826a52863029351b82bbca79b1c60549193c09 # main
        env:
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.BEDROCK_API_KEY }}
          AWS_REGION_NAME: us-east-1
          GITHUB_TOKEN: ${{ github.token }}
          config.model: "bedrock/qwen.qwen3-coder-next"
          config.fallback_models: '[]'
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize", "review_requested"]'
