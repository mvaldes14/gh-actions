# Reusable PR-Agent workflow.
# The caller must trigger this workflow on pull_request_target and issue_comment.
name: PR Agent

on:
  workflow_call:
    secrets:
      BEDROCK_API_KEY:
        description: "Amazon Bedrock API key used by PR-Agent"
        required: true

jobs:
  pr-agent:
    name: Review pull requests with PR-Agent
    # Ignore bot-triggered events, non-PR comments, and Renovate-authored PRs.
    if: >-
      github.event.sender.type != 'Bot' &&
      (
        (
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.user.login != 'renovate[bot]'
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          github.event.issue.user.login != 'renovate[bot]'
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Run PR-Agent
        uses: the-pr-agent/pr-agent@584297340d05e04c42cb4bca3bf56de17607670e # main
        env:
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.BEDROCK_API_KEY }}
          AWS_REGION_NAME: us-east-1
          GITHUB_TOKEN: ${{ github.token }}
          config.model: "bedrock/qwen.qwen3-coder-next"
          config.fallback_models: '[]'
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize", "review_requested"]'
