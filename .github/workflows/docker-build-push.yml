# Reusable workflow: build one image from one context and push it.
#
# Use this for the common case. If you need a genuinely multi-arch manifest,
# use docker-multiarch.yml instead — it builds each platform on its own runner
# rather than emulating them serially in one job.
#
# The caller must grant `packages: write` on the job, because a reusable
# workflow can only downscope the GITHUB_TOKEN it is handed, never widen it.
name: Docker Build and Push

on:
  workflow_call:
    inputs:
      image:
        description: "Image name without the registry host. Defaults to <owner>/<repo>."
        type: string
        required: false
        default: ""
      registry:
        type: string
        required: false
        default: "ghcr.io"
      context:
        type: string
        required: false
        default: "."
      dockerfile:
        type: string
        required: false
        default: "Dockerfile"
      platforms:
        type: string
        required: false
        default: "linux/amd64"
      tags:
        description: "docker/metadata-action tag spec, one directive per line. For a literal tag use `type=raw,value=my-tag`."
        type: string
        required: false
        default: |
          type=ref,event=branch
          type=ref,event=pr
          type=ref,event=tag
          type=sha,format=short
          type=raw,value=latest,enable={{is_default_branch}}
      build-args:
        type: string
        required: false
        default: ""
      target:
        type: string
        required: false
        default: ""
      push:
        description: "Push after building. Defaults to false for pull_request events."
        type: boolean
        required: false
        default: true
      runs-on:
        type: string
        required: false
        default: "ubuntu-latest"
      cache-scope:
        type: string
        required: false
        default: ""
    secrets:
      registry-username:
        description: "Registry username. Defaults to github.actor, which is correct for ghcr.io."
        required: false
      registry-password:
        description: "Registry token. Defaults to the job's GITHUB_TOKEN, which is correct for ghcr.io."
        required: false
    outputs:
      digest:
        description: "Digest of the pushed image"
        value: ${{ jobs.build.outputs.digest }}
      tags:
        description: "Tags that were applied"
        value: ${{ jobs.build.outputs.tags }}
      version:
        description: "Primary version metadata-action derived"
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.build.outputs.tags }}
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and push
        id: build
        # Must be the fully qualified path, not ./docker-build — inside a reusable
        # workflow a relative `uses` resolves against the *caller's* checkout.
        uses: mvaldes14/gh-actions/docker-build@main
        with:
          registry: ${{ inputs.registry }}
          image: ${{ inputs.image != '' && inputs.image || github.repository }}
          username: ${{ secrets.registry-username || github.actor }}
          password: ${{ secrets.registry-password || secrets.GITHUB_TOKEN }}
          context: ${{ inputs.context }}
          dockerfile: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          target: ${{ inputs.target }}
          build-args: ${{ inputs.build-args }}
          # Never push from a fork PR: the token is read-only there anyway.
          push: ${{ inputs.push && github.event_name != 'pull_request' }}
          cache-scope: ${{ inputs.cache-scope != '' && inputs.cache-scope || inputs.context }}
          tags: ${{ inputs.tags }}
