name: "Gotify Notification"
description: "Send a notification to a Gotify server"

inputs:
  gotify-url:
    description: "Gotify server URL (e.g. https://gotify.example.com)"
    required: true
  gotify-token:
    description: "Gotify application token"
    required: true
  title:
    description: "Notification title"
    required: false
    default: "GitHub Actions"
  message:
    description: "Notification message body"
    required: true
  priority:
    description: "Message priority (0-10)"
    required: false
    default: "5"

runs:
  using: "composite"
  steps:
    - name: Send Gotify notification
      shell: bash
      env:
        GOTIFY_URL: ${{ inputs.gotify-url }}
        GOTIFY_TOKEN: ${{ inputs.gotify-token }}
        GOTIFY_TITLE: ${{ inputs.title }}
        GOTIFY_MESSAGE: ${{ inputs.message }}
        GOTIFY_PRIORITY: ${{ inputs.priority }}
      run: |
        set -euo pipefail
        GOTIFY_URL="${GOTIFY_URL%/}"
        [[ "$GOTIFY_PRIORITY" =~ ^[0-9]+$ && "$GOTIFY_PRIORITY" -le 10 ]] || {
          echo "::error::priority must be an integer from 0 to 10"
          exit 1
        }
        curl --fail-with-body --silent --show-error --retry 3 \
          --request POST \
          --url "$GOTIFY_URL/message" \
          --header "X-Gotify-Key: $GOTIFY_TOKEN" \
          --form-string "title=$GOTIFY_TITLE" \
          --form-string "message=$GOTIFY_MESSAGE" \
          --form-string "priority=$GOTIFY_PRIORITY"
